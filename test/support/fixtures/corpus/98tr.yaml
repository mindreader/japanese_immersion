{"title":"TODO","translation":[{"english":"\"You said you wanted to learn horseback riding, didn't you? Then I'll teach you right away. Come!\"","japanese":"「乗馬を習いたいのだったな？　ならば早速教えてやろう。来い！」"},{"english":"\"Young master!\"","japanese":"「坊ちゃま！」"},{"english":"\"Prince, that's not a good move. At the very least, I need to make it look like we're studying, or I'll surely be thrown out by Lord Michael or someone.\"","japanese":"「王子、それは良い手ではありません。一応、フリだけでも勉強をしているように見せないと、きっとミカエル様あたりに僕が放り出されてしまいます」"},{"english":"\"I suppose you're right. How dull.\"","japanese":"「それもそうか。つまらんな」"},{"english":"\"Prince, do you like horses?\"","japanese":"「王子は馬がお好きで？」"},{"english":"\"Ah, the exhilaration of riding on horseback and racing through—there's nothing else that compares to it, you know?\"","japanese":"「ああ、馬の背に乗り駆け抜ける爽快さといったら並ぶものなど他にないぞ？」"},{"paragraph_break":true},{"english":"Is that so? How enviable.","japanese":"そうなのか、なんとも羨ましいな。"},{"english":"I guess it's like motorcycles from my previous life.","japanese":"前世でいうところのバイクみたいな感じかな。"},{"paragraph_break":true},{"english":"\"Earlier, Prince, you said you understand mathematics sufficiently, but does that mean addition and subtraction?\"","japanese":"「先ほど王子は数学は充分理解いただいているとおっしゃってましたが、それは数の足し引きですか？」"},{"english":"\"What else is there besides that?\"","japanese":"「それ以外に何があるのだ」"},{"paragraph_break":true},{"english":"There's multiplication and division, though.","japanese":"掛け算、割り算があるだろうが。"},{"english":"I thought that, but if I said it, he'd probably get sulky.","japanese":"そう思ったが、そう言ったらヘソを曲げるだろうな。"},{"paragraph_break":true},{"english":"\"Then here's a quiz. Eight legs can be seen from under the stable door. How many horses are there?\"","japanese":"「ではクイズです。馬房の扉の下から脚が8本見えます。馬は何頭でしょうか？」"},{"english":"\"Don't make fun of me. Two horses, right?\"","japanese":"「馬鹿にするな。2頭だろう」"},{"english":"\"Oh, that was fast! As expected. Then if you captured three wild horses, how many horseshoes would be needed?\"","japanese":"「おお、早い！　流石ですね。では野生馬を3頭捕えたとして蹄鉄は何個必要になりますか？」"},{"paragraph_break":true},{"english":"The prince furrowed his brows and thought.","japanese":"王子は眉を寄せて考えた。"},{"english":"He looks like he's restraining himself from counting on his fingers.","japanese":"指を折って数えるのを我慢しているように見える。"},{"paragraph_break":true},{"english":"\"Twelve.\"","japanese":"「12だ」"},{"english":"\"Wonderful! You really don't seem to need this, do you?\"","japanese":"「素晴らしい！　本当に必要なさそうですね」"},{"english":"\"Now, Omi!\"","japanese":"「これ、オミ！」"},{"paragraph_break":true},{"english":"I was scolded by Mr. Luca in a low voice, but please rest assured.","japanese":"ルカ氏に小声で叱られたが安心して欲しい。"},{"paragraph_break":true},{"english":"\"Then here's the next quiz. Some of the soldiers the prince leads were injured, so you temporarily hired 20 adventurers as mercenaries for just five days. You hired them with a contract for a daily wage of 30 rami.\"","japanese":"「では次のクイズです。王子の率いる兵のうち何名かが負傷し、五日間だけ20名の冒険者を傭兵として臨時に雇いました。冒険者の日当が30ラーミという契約で雇いました」"},{"english":"\"Hmm?\"","japanese":"「うん？」"},{"english":"\"I don't actually think such a situation would occur. Please consider it purely as a quiz.\"","japanese":"「実際こういう事態があるとは思ってません。あくまでクイズとしてお考えください」"},{"english":"\"Hmm.\"","japanese":"「ふむ」"},{"english":"\"Five days, 20 people, 30 rami.\"","japanese":"「五日間、20名、30ラーミです」"},{"english":"\"Mm.\"","japanese":"「うむ」"},{"english":"\"After winning the battle, you received a bill from the adventurer party for 4500 rami. Prince, will you pay this? Or won't you? Additionally, assume that your trustworthy subordinate who is good at calculations was injured and has withdrawn to the rear.\"","japanese":"「戦いに勝ったのち。冒険者パーティから4500ラーミの請求を受けました。王子はこれを払いますか？　払いませんか？　なお、信用のおける計算が得意な部下は負傷し後方に下がっているとします」"},{"english":"\"What? Wait a moment. What was it again?\"","japanese":"「なんだと？　ちよっとまて。なんだっけ？」"},{"english":"\"Five days, 20 people, 30 rami. The billed amount is 4500 rami.\"","japanese":"「五日間、20名、30ラーミ。請求額は4500ラーミです」"},{"paragraph_break":true},{"english":"The prince furrowed his brows and looked up at the ceiling thinking, but he's not showing any sign of counting on his fingers.","japanese":"王子は眉を寄せ天井を見上げて考えているが、指を折るそぶりは見せていない。"},{"english":"As expected, when the digits go up, it feels more difficult, doesn't it?","japanese":"やっぱ桁が上がると難しく感じるよね。"},{"english":"Well, I'm not good at it either, so I understand.","japanese":"いや、俺も得意ではないから分かる。"},{"paragraph_break":true},{"english":"\"The answer is pay or don't pay, right?\"","japanese":"「答えは払う、払わないだな？」"},{"english":"\"Yes, that's right.\"","japanese":"「はい、そうです」"},{"english":"\"Then I'll pay. We won the battle.\"","japanese":"「ならば、払おう。戦には勝ったのだ」"},{"english":"\"As expected, the prince is generous. You'll become a good leader loved by the people.\"","japanese":"「さすが王子は太っ腹です。民に好かれる良き長となるでしょう」"},{"english":"\"Hmm.\"","japanese":"「ふむ」"},{"english":"\"However, you'll be looked down upon by the adventurers. They'll think you're an easy mark, Prince.\"","japanese":"「ですが、冒険者からは舐められます。チョロい王子だと」"},{"english":"\"What? Then is the correct answer to this quiz 'don't pay'?\"","japanese":"「なんだと？　ではこのクイズの正解は払わないが正解なのか」"},{"english":"\"Calculation-wise, yes. Multiplying 5, 20, and 30 gives you 3000. Since the bill was 4500, Prince, you were overcharged 1500 by the adventurers. In currency, that's one gold coin and five large copper coins.\"","japanese":"「計算的にはそうです。5と20と30を掛け合わせると3000になります。請求は4500でしたので王子は冒険者に1500。貨幣にすると金貨一枚と大銅貨5枚をボラれました」"},{"english":"\"Since we won the battle, isn't it fine to give them that much?\"","japanese":"「戦に勝ったのだからそれくらいくれてやれば良いではないか」"},{"english":"\"That's quite reasonable. Then let's consider the case where you don't pay.\"","japanese":"「ごもっともです。では支払わない場合を考えてみましょう」"},{"paragraph_break":true},{"english":"The prince sat down on the desk surface and nodded while crossing his arms.","japanese":"王子は机の天板に腰を下ろし、腕組みをしながら頷いた。"},{"paragraph_break":true},{"english":"\"You reject them, saying they billed 4500 when the contract was for 3000, and detain the party leader on suspicion of fraud.\"","japanese":"「本来、契約で3000のところを4500請求されたと突っぱね、詐欺の疑いでパーティリーダーを拘束します」"},{"english":"\"Hmm.\"","japanese":"「ふむ」"},{"english":"\"Then the remaining party members will come pleading, saying that bill was just a careless calculation mistake. That it was originally 3000, but since it's their error, 2000 will be fine, so please release the leader.\"","japanese":"「すると残ったパーティメンバーからあの請求はついうっかりした計算間違いだと。本来3000でしたがこちらのミスですから2000で結構ですのでどうかリーダーを放免してやってくださいと嘆願がきます」"},{"english":"\"Is that so?\"","japanese":"「そうなのか？」"},{"english":"\"Well, I don't know for sure. What do you think, Mr. Luca?\"","japanese":"「まあ、わかりませんが。どうですかね、ルカさん」"},{"paragraph_break":true},{"english":"Mr. Luca nodded vigorously.","japanese":"ルカ氏は激しく頷いた。"},{"paragraph_break":true},{"english":"\"It's a plausible story. 1500 is too much of an overcharge, but the more money is involved, the more people will try to skim off the top.\"","japanese":"「ありえる話だ。1500はボり過ぎだが、使う金額が増えれば増えるほど中抜きをしようと試みる者は増えるものだ」"},{"english":"\".....\"","japanese":"「、、、、、」"},{"english":"\"Then I'll continue. Not only does the prince get it done for 2000 instead of 3000, but you'll be recognized by all the people as a sharp leader who's dangerous to underestimate.\"","japanese":"「では、続けます。王子は3000のところが2000で済む上に、舐めたらヤバい切れ者の長だと民全体から認識されます」"},{"english":"\"By all the people?\"","japanese":"「民全体から？」"},{"english":"\"Yes, such rumors spread in an instant. Even to other countries if anything.\"","japanese":"「そうです、そうした噂はあっという間に広がりますから。なんなら他国にまで」"},{"english":"\"That much?\"","japanese":"「そんなにか？」"},{"english":"\"Prince, have you ever sent spies to other countries?\"","japanese":"「王子は他国にスパイを差し向けたことは？」"},{"english":"\"No, no, I haven't.\"","japanese":"「ないない、ないぞ？」"},{"english":"\"For example, the neighboring country Cayen. If you had to cooperate with them...\"","japanese":"「たとえばですが、隣国のカイエン。あそこと共闘しなければならなくなったとして、、、」"},{"english":"\"Mm... I hear that in that country, the Armelia military and the Pope have more influence than the lord?\"","japanese":"「む、、、彼の国は領主よりもアーメリア軍や教皇の方が発言力が高いと聞くぞ？」"},{"english":"\"Exactly. They believe rumors.\"","japanese":"「そういうことです。噂を信じるのです」"},{"paragraph_break":true},{"english":"The prince walked around to the other side of the desk and sat down in the chair.","japanese":"王子は机の向こうまで回り込んで椅子に腰を下ろした。"},{"paragraph_break":true},{"english":"\"I see. Omi, you're quite the sharp one, aren't you!\"","japanese":"「なるほどな。オミよ、そなた中々の切れ者ではないか！」"},{"english":"\"Thank you very much.\"","japanese":"「ありがとうございます」"},{"english":"\"I'll make you my servant!\"","japanese":"「我が僕にしてやってもよいぞ！」"},{"english":"\"What an honor.\"","japanese":"「ありがたき幸せ」"},{"english":"\"Young master, Master Omi is already the prince's servant, isn't he...?\"","japanese":"「坊っちゃん、オミ殿は既に王子の僕ですぞ、、、？」"},{"english":"\"He's my sister's, isn't he? What I was asked to do was shelter him. That's right, our association will be short anyway. I'll dote on you as a younger brother. You wanted to learn horsemanship and swordsmanship, right? I permit you to accompany me in my training!\"","japanese":"「姉君の、ではないか。我が頼まれたのは匿うことだ。そうだな、お主とはどうせ短い付き合いだ。弟分として可愛がってやる。習いたいのは馬術と剣術だったな？　我の稽古に付き合うことを許可する！」"},{"english":"\"Thank you very much!\"","japanese":"「ありがとうございます！」"},{"english":"\"Good, then immediately, I'll teach you horsemanship.\"","japanese":"「よし、では早速だが馬術を教えてやろう」"},{"english":"\"Young master, it's still too early!\"","japanese":"「坊ちゃん、まだ早いです！」"},{"paragraph_break":true},{"english":"We've only done three quiz questions after all.","japanese":"まだ、クイズを3問やっただけだからな。"},{"paragraph_break":true},{"english":"\"Prince, do you know that besides addition and subtraction, there are multiplication and division?\"","japanese":"「王子、足し引きの他に掛け算、割り算というのがあるのはご存知で？」"},{"english":"\"Of course, I know they exist. But you can derive the answer from addition and subtraction too. Isn't it practical?\"","japanese":"「無論、あるのは知っておる。しかし足し引きからでも答えは導き出せるのだ。実用的ではないだろう？」"},{"english":"\"Young master, that quiz just now was multiplication!\"","japanese":"「坊っちゃん、さっきのクイズが掛け算でしたのですぞ！」"},{"english":"\"Is that so?\"","japanese":"「そうなのか？」"},{"english":"\"Yes. It may seem meaningless as a study, but for someone in a position to lead soldiers, it's essential arithmetic for achieving military merit.\"","japanese":"「はい。勉強としては意味のないものに思えますが兵を率いる立場の者には武功を上げるためにも必須の算術でございます」"},{"english":"\"...Is that so? I don't quite grasp it, but...\"","japanese":"「、、、そうなのか？　いまいちピンと来ないが」"},{"english":"\"Of course, fighting and achieving battle results. This is the most important.\"","japanese":"「もちろん戦って戦果を上げる。これが一番です」"},{"english":"\"That's right.\"","japanese":"「そうだろう」"},{"english":"\"That's right. For example, imagine a case where the enemy has fled in defeat.\"","japanese":"「そうですね、例えばですが相手が敗走した場合を想像してください」"},{"english":"\"Mm.\"","japanese":"「うむ」"},{"english":"\"If you pursue them, it seems you could defeat their commander.\"","japanese":"「追えば旗頭を倒せそうです」"},{"english":"\"Then pursue. There's no need to hesitate, is there?\"","japanese":"「ならば追え。迷う必要はないだろう」"},{"english":"\"However, the journey up to that point has been long, and there's little food remaining.\"","japanese":"「しかし、それまでの道のりが長びき食料の残りが少ないです」"},{"english":"\"Ah, that can happen too. However...\"","japanese":"「ああ、そういうこともあるか。しかし、、、」"},{"english":"\"It's possible if you narrow down the number of people.\"","japanese":"「人数を絞れば可能です」"},{"english":"\"Mm.\"","japanese":"「む」"},{"english":"\"In such times, if you're quick at calculation, you can make decisions instantly. There's no need to have someone else calculate and listen to multiple estimates. It's an immediate decision.\"","japanese":"「そういう時に計算が早いと即座に決断ができるのです。誰かに計算をさせて幾つもの試算を聞く必要もありません。即決です」"},{"paragraph_break":true},{"english":"The prince let out a groan.","japanese":"王子は唸り声を挙げた。"},{"paragraph_break":true},{"english":"\"Alright, I understand! I just need to study arithmetic, right? Teach me!\"","japanese":"「よし、分かった！　算術を勉強すれば良いのだろう？　我に教えて見せよ！」"},{"paragraph_break":true},{"english":"Hmm, I somehow managed to persuade him.","japanese":"ふむ、なんとか説得できたぞ。"},{"english":"However, the problem is from here on.","japanese":"しかし、問題はここからだな。"}]}